<style>
  :root {
    --bg: #f7f8f9;
    --surface: #ffffff;
    --border: #e2e5e9;
    --text: #16191d;
    --muted: #6b7280;
    --accent: #1f6feb;
    --accent-text: #ffffff;
    --bubble-me: #1f6feb;
    --bubble-me-text: #ffffff;
    --bubble-them: #ffffff;
    --danger: #b42318;
    --danger-bg: #fff4f2;
    --danger-border: #f4c9c2;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418;
      --surface: #181c21;
      --border: #262c33;
      --text: #e9ecef;
      --muted: #949ca6;
      --accent: #2d8aff;
      --accent-text: #ffffff;
      --bubble-me: #2d8aff;
      --bubble-me-text: #ffffff;
      --bubble-them: #1e232a;
      --danger: #ff9c8f;
      --danger-bg: #2a1a19;
      --danger-border: #4a2a27;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    flex: 1;
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header .sub {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #resetBtn {
    flex: none;
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #resetBtn:active { background: var(--bg); }

  #list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 4px;
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .row.them { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .row.me .bubble {
    background: var(--bubble-me);
    color: var(--bubble-me-text);
    border-bottom-right-radius: 4px;
  }
  .row.them .bubble {
    background: var(--bubble-them);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .row.error .bubble {
    background: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    font-size: 14px;
    border-bottom-left-radius: 4px;
  }
  .retry {
    display: block;
    margin-top: 8px;
    font: inherit;
    font-size: 13px;
    color: var(--danger);
    background: transparent;
    border: 1px solid var(--danger-border);
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
  }

  .row.pending .bubble {
    font-style: italic;
    opacity: 0.85;
  }

  .typing .bubble {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px;
  }
  .typing i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: 0.18s; }
  .typing i:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink {
    0%, 60%, 100% { opacity: 0.25; }
    30% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing i { animation: none; opacity: 0.5; }
  }

  /* Inline "still working" indicator appended to a pending status bubble
     while its job is being polled - same dots as .typing, smaller and
     inline so they trail right after the status text. */
  .dots {
    display: inline-flex;
    gap: 3px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .dots i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
    animation: blink 1.2s infinite ease-in-out;
  }
  .dots i:nth-child(2) { animation-delay: 0.18s; }
  .dots i:nth-child(3) { animation-delay: 0.36s; }
  @media (prefers-reduced-motion: reduce) {
    .dots i { animation: none; opacity: 0.5; }
  }

  #empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 24px;
  }
  #empty strong {
    display: block;
    color: var(--text);
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  form {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    background: var(--surface);
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    resize: none;
    max-height: 140px;
    overflow-y: auto;
    line-height: 1.4;
  }
  #input:focus {
    outline: none;
    border-color: var(--accent);
  }
  #send {
    flex: none;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.4; cursor: default; }
  #send svg { width: 20px; height: 20px; }

  #attachBtn {
    flex: none;
    width: 44px;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  #attachBtn:active { background: var(--bg); }
  #attachBtn svg { width: 20px; height: 20px; }
  #fileInput { display: none; }

  #attachments {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 10px 14px 0;
    padding-left: calc(14px + env(safe-area-inset-left));
    padding-right: calc(14px + env(safe-area-inset-right));
    overflow-x: auto;
    background: var(--surface);
  }
  #attachments[hidden] { display: none; }
  .attach-thumb {
    position: relative;
    flex: none;
    width: 60px;
    height: 60px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .attach-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .attach-thumb button {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 18px;
    height: 18px;
    border: none;
    border-radius: 5px;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
  }

  .bubble-images {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .bubble-images:not(:first-child) { margin-top: 8px; }
  .bubble-text { margin-top: 8px; }
  .bubble-images img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
    cursor: zoom-in;
    display: block;
  }

  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: grid;
    place-items: center;
    padding: 24px;
    padding: calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    cursor: zoom-out;
    z-index: 10;
  }
  #lightbox[hidden] { display: none; }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    object-fit: contain;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Trade Chat<span class="sub" id="sessionLabel"></span></h1>
    <button type="button" id="resetBtn">New chat</button>
  </header>

  <div id="list" aria-live="polite">
    <div id="empty">
      <strong>Start a conversation</strong>
      Messages are sent to your n8n workflow and answered there.
    </div>
  </div>

  <div id="attachments" hidden></div>

  <form id="composer" autocomplete="off">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <button type="button" id="attachBtn" aria-label="Attach images">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path>
      </svg>
    </button>
    <textarea id="input" rows="1" placeholder="Message" enterkeyhint="send"></textarea>
    <button type="submit" id="send" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h15M13 6l6 6-6 6"></path>
      </svg>
    </button>
  </form>
</div>

<div id="lightbox" hidden>
  <img id="lightboxImg" alt="">
</div>

<script>
(function () {
  'use strict';

  var ENDPOINT = 'https://nikolakuze.app.n8n.cloud/webhook/dtjournal-chat';
  var RESULT_ENDPOINT = 'https://nikolakuze.app.n8n.cloud/webhook/dtjournal-result';
  var POLL_INTERVAL_MS = 3000;
  var POLL_TIMEOUT_MS = 3 * 60 * 1000; // give up waiting for a background job after ~3 minutes
  var SESSION_KEY = 'dtchat.sessionId';
  var LOG_KEY = 'dtchat.log';
  var TIMEOUT_MS = 90000;
  var MAX_ATTACHMENTS = 6;
  var MAX_SOURCE_BYTES = 25 * 1024 * 1024; // guards against hanging on a huge photo before it's even resized

  /* ---------- storage (a blocked localStorage must not break the app) ---------- */

  function get(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function set(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* private mode */ }
  }
  function del(key) {
    try { localStorage.removeItem(key); } catch (e) {}
  }

  function makeId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    if (window.crypto && crypto.getRandomValues) {
      var a = new Uint8Array(16);
      crypto.getRandomValues(a);
      return Array.prototype.map.call(a, function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
    }
    return 'x' + Date.now().toString(16) + Math.random().toString(16).slice(2, 10);
  }

  var sessionId = get(SESSION_KEY);

    }

  function saveLog() {

    // plain text ever did. Rather than silently lose the whole transcript (or
    // silently write nothing, per the try/catch in `set`), drop the oldest
    // messages one at a time until what's left actually fits.
    while (log.length) {
      try {
        localStorage.setItem(LOG_KEY, JSON.stringify(log));
        return;
      } catch (e) {

      }
    }
    del(LOG_KEY);
  }

  function atBottom() {

  function scrollToEnd() {

  function dropEmpty() {

  function addBubble(role, text, images, pending) {
    dropEmpty();
    var row = document.createElement('div');
    row.className = 'row ' + (role === 'user' ? 'me' : 'them') + (pending ? ' pending' : '');
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (images && images.length) {
      var grid = document.createElement('div');
      grid.className = 'bubble-images';
      images.forEach(function (src) {
        var img = document.createElement('img');
        img.src = src;
        img.alt = 'Attached image';
        img.addEventListener('click', function () { openLightbox(src); });
        grid.appendChild(img);
      });
      bubble.appendChild(grid);
    }
    if (text) {
      var textNode = document.createElement('div');
      if (images && images.length) textNode.className = 'bubble-text';
      textNode.textContent = text;
      bubble.appendChild(textNode);
    }
    row.appendChild(bubble);
    list.appendChild(row);
    scrollToEnd();
    return row;
  }

  // while its job is being polled. Plain textContent assignment (used to
  // swap in the final reply or an error later) wipes this along with the
  // status text, so nothing has to remove it explicitly.
  function addSpinner(row) {
    var bubble = row.querySelector('.bubble');
    var target = bubble.lastElementChild || bubble;
    var dots = document.createElement('span');
    dots.className = 'dots';
    dots.appendChild(document.createElement('i'));
    dots.appendChild(document.createElement('i'));
    dots.appendChild(document.createElement('i'));

  function addError(message, retryText, retryImages) {
    dropEmpty();
    var row = document.createElement('div');
    row.className = 'row them error';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = message;
    // An images-only message has an empty retryText, so a plain truthiness
    // check on retryText alone would silently drop the Retry button for it.
    if (retryText || (retryImages && retryImages.length)) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'retry';
      btn.textContent = 'Retry';
      btn.addEventListener('click', function () {

        row.parentNode.removeChild(row);
        send(retryText, retryImages, true);

    row.appendChild(bubble);
    list.appendChild(row);
    scrollToEnd();

  function showTyping() {
    dropEmpty();

    row.className = 'row them typing';

    bubble.className = 'bubble';
    bubble.appendChild(document.createElement('i'));
    bubble.appendChild(document.createElement('i'));

  for (var i = 0; i < log.length; i++) {
    var restored = log[i];
    var restoredRow = addBubble(restored.role, restored.text, restored.images, restored.status === 'processing');
    // A reload mid-job (backgrounding the phone, say) would otherwise leave
    // this bubble saying "processing" forever with no polling behind it -
    // pick back up where it left off instead. Its original ~3 minute budget
    // isn't tracked across reloads, so this restarts the clock; if the job
    // already finished server-side, the very first poll below will just say
    // so right away.

      startPolling(restored.jobId);

  // Every attached image is downscaled and re-encoded as JPEG through a
  // canvas before it ever touches localStorage or the network: a raw phone
  // photo can be 10+ MB, which is both slow to POST and enough on its own to
  // blow past localStorage's quota after a handful of messages. The same
  // processed copy is used for the on-screen thumbnail, the persisted
  // transcript and the payload sent to the workflow, so what you see is
  // exactly what gets sent.
  function loadImageEl(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('Could not read that image.')); };
      img.src = url;
    });
  }

  function processImageFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('Could not read "' + file.name + '".')); };
      reader.onload = function () {
        loadImageEl(reader.result).then(function (img) {
          var scale = Math.min(1, ATTACH_MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * scale));
          var h = Math.max(1, Math.round(img.naturalHeight * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          var ctx = canvas.getContext('2d');
          // Flatten onto white first - JPEG has no alpha channel, so a
          // transparent PNG/screenshot would otherwise composite to black.
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve({
            id: makeId(),
            name: file.name || 'image.jpg',
            mimeType: 'image/jpeg',
            dataUrl: canvas.toDataURL('image/jpeg', ATTACH_QUALITY)
          });
        }).catch(reject);
      };
      reader.readAsDataURL(file);
    });
  }

  function renderAttachments() {
    attachmentsBar.textContent = '';
    attachmentsBar.hidden = pendingAttachments.length === 0;
    pendingAttachments.forEach(function (a) {
      var thumb = document.createElement('div');
      thumb.className = 'attach-thumb';
      var img = document.createElement('img');
      img.src = a.dataUrl;
      img.alt = a.name;

      remove.type = 'button';

      thumb.appendChild(remove);
      attachmentsBar.appendChild(thumb);

  function attachFiles(fileList) {
    var files = Array.prototype.filter.call(fileList, function (f) {
      return f.type && f.type.indexOf('image/') === 0;

    if (!files.length) {
      if (fileList.length) addError('Only images can be attached.', null);
      return;
    }
    var room = MAX_ATTACHMENTS - pendingAttachments.length;
    if (room <= 0) {
      addError('You can attach up to ' + MAX_ATTACHMENTS + ' images per message.', null);
      return;
    }
    if (files.length > room) {
      addError('Only ' + room + ' more image' + (room === 1 ? '' : 's') + ' can be attached to this message.', null);
      files = files.slice(0, room);
    }
    files = files.filter(function (f) {
      if (f.size > MAX_SOURCE_BYTES) {
        addError('"' + f.name + '" is too large to attach (over 25 MB).', null);

      return true;

      pendingAttachments = pendingAttachments.concat(results);
      renderAttachments();
    }).catch(function (err) {
      addError((err && err.message) || 'Could not process that image.', null);

  // A screenshot copied to the clipboard (Win+Shift+S, cmd+ctrl+shift+4, or
  // "Copy image" from a browser) shows up as a File on the paste event -
  // there's no separate "paste an image" control, it just works in the
  // message field.
  input.addEventListener('paste', function (e) {
    var items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    var files = [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
        var f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) {
      e.preventDefault(); // otherwise some browsers also paste a filename as text
      attachFiles(files);
    }
  });

  // Desktop-only nicety: dropping an image file straight onto the app,
  // instead of the browser navigating to it as a bare image page.
  var appEl = document.getElementById('app');
  appEl.addEventListener('dragover', function (e) { e.preventDefault(); });
  appEl.addEventListener('drop', function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
      attachFiles(e.dataTransfer.files);
    }
  });

  /* ---------- network ---------- */

  // The workflow is expected to answer { reply, sessionId }. n8n can just as
  // easily be wired to return a bare array or a differently named text field,
  // so pull the reply out of the likely shapes rather than render an empty
  // bubble when it does.
  function pickReply(data) {
    if (data == null) return '';
    if (typeof data === 'string') return data;
    if (Array.isArray(data)) return data.length ? pickReply(data[0]) : '';
    var keys = ['reply', 'output', 'text', 'message', 'answer', 'response'];
    for (var k = 0; k < keys.length; k++) {
      var v = data[keys[k]];
      if (typeof v === 'string' && v.trim()) return v;
    }
    if (data.json) return pickReply(data.json);
    return '';
  }

  function pickSessionId(data) {
    if (!data || typeof data !== 'object') return null;
    if (Array.isArray(data)) return data.length ? pickSessionId(data[0]) : null;
    if (typeof data.sessionId === 'string' && data.sessionId) return data.sessionId;
    if (data.json) return pickSessionId(data.json);
    return null;
  }

  // A "processing" response is an immediate ack for a job the workflow keeps
  // working on in the background ({ jobId, status: "processing", reply }) -
  // distinct from a final { reply, sessionId } answer.
  function pickJobId(data) {
    if (!data || typeof data !== 'object') return null;
    if (Array.isArray(data)) return data.length ? pickJobId(data[0]) : null;
    if (typeof data.jobId === 'string' && data.jobId) return data.jobId;
    if (data.json) return pickJobId(data.json);
    return null;
  }

  function pickStatus(data) {
    if (!data || typeof data !== 'object') return null;
    if (Array.isArray(data)) return data.length ? pickStatus(data[0]) : null;
    if (typeof data.status === 'string' && data.status) return data.status;
    if (data.json) return pickStatus(data.json);
    return null;
  }

  function setBusy(state) {
    busy = state;
    sendBtn.disabled = state;
  }

  function send(text, images, isRetry) {
    if (busy) return;
    images = images || [];

    if (!isRetry) {
      var thumbs = images.map(function (a) { return a.dataUrl; });
      var entry = { role: 'user', text: text };
      if (thumbs.length) entry.images = thumbs;
      log.push(entry);
      saveLog();
      addBubble('user', text, thumbs);
    }

    setBusy(true);
    showTyping();

    var controller = ('AbortController' in window) ? new AbortController() : null;
    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      if (controller) controller.abort();
    }, TIMEOUT_MS);

    var payload = { message: text, sessionId: sessionId };
    if (images.length) {
      // Sent as base64 rather than multipart so the whole request stays one
      // plain JSON body - simplest thing for an n8n webhook to parse. The
      // workflow needs to be told what to look for on its side: see the
      // README for the exact shape.
      payload.images = images.map(function (a) {
        return { name: a.name, type: a.mimeType, data: a.dataUrl.split(',')[1] };
      });
    }

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller ? controller.signal : undefined
    }).then(function (res) {
      return res.text().then(function (body) {
        if (!res.ok) {
          throw new Error('The workflow returned ' + res.status + (body ? ': ' + body.slice(0, 200) : '') + '.');
        }
        try {
          return body ? JSON.parse(body) : null;
        } catch (e) {
          return body;
        }
      });
    }).then(function (data) {
      clearTimeout(timer);
      hideTyping();
      setBusy(false);

      var returned = pickSessionId(data);
      if (returned && returned !== sessionId) {
        sessionId = returned;
        set(SESSION_KEY, sessionId);
        showSession();
      }

      var jobId = pickJobId(data);
      if (jobId && pickStatus(data) === 'processing') {
        // The workflow answered right away but is still working in the
        // background. Show its status text now, styled in italics to mark
        // it as provisional, then start polling for the real result.
        var statusText = pickReply(data) || 'Working on it…';
        var entry = { role: 'assistant', text: statusText, jobId: jobId, status: 'processing' };
        log.push(entry);
        saveLog();
        var row = addBubble('assistant', statusText, null, true);
        addSpinner(row);
        pendingJobs[jobId] = { row: row, entry: entry };
        startPolling(jobId);
        return;
      }

      var reply = pickReply(data);
      if (!reply.trim()) {
        addError('The workflow answered, but with no text in it.', text, images);
        return;
      }
      log.push({ role: 'assistant', text: reply });
      saveLog();
      addBubble('assistant', reply);
    }).catch(function (err) {
      clearTimeout(timer);
      hideTyping();
      setBusy(false);

      var message;
      if (timedOut || (err && err.name === 'AbortError')) {
        message = 'No answer within 90 seconds, so the request was given up on.';
      } else if (navigator.onLine === false) {
        message = 'You are offline. Reconnect and try again.';
      } else {
        message = (err && err.message) ? err.message : 'Something went wrong.';
        if (/failed to fetch|networkerror|load failed/i.test(message)) {
          message = 'Could not reach the workflow. Check your connection, and that the webhook is active.';
        }
      }
      addError(message, text, images);
    });
  }

  // Turns a still-pending status bubble into its final state: the real
  // reply on success, or an in-place error if the job errored out or was
  // never heard from again. A no-op if the job was already cleared (e.g.
  // "New chat" ran while a poll was in flight).
  function finishJob(jobId, reply, err) {
    var job = pendingJobs[jobId];
    delete pendingJobs[jobId];
    if (!job) return;

    var bubble = job.row.querySelector('.bubble');
    if (err) {
      job.row.className = 'row them error';
      bubble.textContent = err.message;
      job.entry.text = err.message;
      job.entry.status = 'error';
    } else {
      job.row.className = 'row them';
      bubble.textContent = reply;
      job.entry.text = reply;
      job.entry.status = 'done';
    }
    delete job.entry.jobId;
    saveLog();
    scrollToEnd();
  }

  // Polls RESULT_ENDPOINT with { jobId } every POLL_INTERVAL_MS until it
  // reports { status: "done", reply }, reports some other status (treated
  // as failure), or POLL_TIMEOUT_MS is up. A transient network error while
  // polling is retried rather than failing the job outright - it's the
  // overall timeout's job to eventually give up, not one bad request.
  function startPolling(jobId) {
    var deadline = Date.now() + POLL_TIMEOUT_MS;

    function tick() {
      var job = pendingJobs[jobId];
      if (!job) return; // cancelled - e.g. "New chat" - stop quietly

      if (Date.now() > deadline) {
        finishJob(jobId, null, new Error('Gave up waiting for a result after 3 minutes.'));
        return;
      }

      fetch(RESULT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jobId: jobId })
      }).then(function (res) {
        return res.text().then(function (body) {
          if (!res.ok) {
            throw new Error('The status check returned ' + res.status + (body ? ': ' + body.slice(0, 200) : '') + '.');
          }
          try {
            return body ? JSON.parse(body) : null;
          } catch (e) {
            return body;
          }
        });
      }).then(function (data) {
        var job2 = pendingJobs[jobId];
        if (!job2) return; // cancelled while this check was in flight

        var status = pickStatus(data);
        if (status === 'done') {
          finishJob(jobId, pickReply(data) || 'Done.', null);
        } else if (status && status !== 'processing') {
          finishJob(jobId, null, new Error(pickReply(data) || ('The job reported status "' + status + '".')));
        } else {
          job2.timer = setTimeout(tick, POLL_INTERVAL_MS);
        }
      }).catch(function () {
        var job3 = pendingJobs[jobId];
        if (job3) job3.timer = setTimeout(tick, POLL_INTERVAL_MS);
      });
    }

    pendingJobs[jobId].timer = setTimeout(tick, POLL_INTERVAL_MS);
  }

  /* ---------- composer ---------- */

  // scrollHeight measures the content box; the element is border-box, so the
  // two 1px borders have to be added back or the field sits 2px short and
  // shows a scrollbar with nothing to scroll.
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight + 2, 140) + 'px';
  }
  input.addEventListener('input', autoGrow);

  function submit() {
    var text = input.value.trim();
    if ((!text && !pendingAttachments.length) || busy) return;
    var images = pendingAttachments;
    pendingAttachments = [];
    renderAttachments();
    input.value = '';
    autoGrow();
    send(text, images, false);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    submit();
  });

  // On a phone, Enter inserts a newline and the button sends. With a physical
  // keyboard, Enter sends and Shift+Enter inserts a newline.
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !coarse) {
      e.preventDefault();
      submit();
    }
  });

  resetBtn.addEventListener('click', function () {
    if ((log.length || pendingAttachments.length) && !confirm('Start a new conversation? This clears the current one.')) return;
    log = [];
    del(LOG_KEY);
    sessionId = makeId();
    set(SESSION_KEY, sessionId);
    showSession();
    while (list.firstChild) list.removeChild(list.firstChild);
    list.appendChild(empty);
    pendingAttachments = [];
    renderAttachments();
    Object.keys(pendingJobs).forEach(function (jobId) { clearTimeout(pendingJobs[jobId].timer); });
    pendingJobs = {};
    input.focus();
  });

  // Keep the composer above the on-screen keyboard on browsers that shrink the
  // visual viewport instead of the layout viewport (iOS Safari).
  if (window.visualViewport) {
    var app = document.getElementById('app');
    var vv = window.visualViewport;
    var syncViewport = function () {
      var stuck = atBottom();
      app.style.height = vv.height + 'px';
      if (stuck) scrollToEnd();
    };
    vv.addEventListener('resize', syncViewport);
    vv.addEventListener('scroll', syncViewport);
  }

  /* ---------- installable without a separate manifest file ---------- */

  try {
    var base = location.href.split('#')[0].split('?')[0];
    var manifest = {
      name: 'Trade Chat',
      short_name: 'Trade Chat',
      start_url: base,
      scope: base.replace(/[^/]*$/, ''),
      display: 'standalone',
      background_color: '#111418',
      theme_color: '#111418',
      icons: [
        { src: ICON512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: ICON512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;base64,' +
      btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
    document.head.appendChild(link);
  } catch (e) { /* not installable from here; the page still works */ }

  autoGrow();
})();
</script>
</body>
</html>
